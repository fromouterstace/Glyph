openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /glyph/system/access:
    get:
      operationId: getSystemAccess
      responses:
        '200':
          description: Indicates whether the authenticated user has system access
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /glyph/system/session:
    post:
      operationId: recordSystemSession
      responses:
        '200':
          description: App-observed sign-in session recorded idempotently
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /glyph/system/summary:
    get:
      operationId: getSystemSummary
      responses:
        '200':
          description: Aggregate system metrics restricted to configured administrators
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SystemSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /glyph/native/prepare:
    post:
      operationId: prepareNativeMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NativeMessageInput' }
      responses:
        '200':
          description: Tracking material for a Gmail compose; not proof of sending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeTracking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /glyph/native/sync:
    post:
      operationId: syncNativeMessages
      responses:
        '200':
          description: Confirm native Gmail sends against Gmail Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeSync' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /glyph/overview:
    get:
      operationId: getOverview
      responses:
        '200':
          description: Authenticated owner's engagement overview from PostgreSQL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /glyph/messages:
    get:
      operationId: listMessages
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - {
            name: status,
            in: query,
            schema:
              {
                type: string,
                enum:
                  [
                    all,
                    draft,
                    sending,
                    sent,
                    failed,
                    uncertain,
                    opened,
                    clicked,
                    unopened,
                  ],
              },
          }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 10000, default: 0 },
          }
      responses:
        '200':
          description: Bounded, ordered page of the authenticated owner's messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessagePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageInput' }
      responses:
        '201':
          description: Draft saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /glyph/messages/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getMessage
      responses:
        '200':
          description: Message detail with database-aggregated signal totals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageInput' }
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteMessage
      responses:
        '204': { description: Draft deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /glyph/messages/{id}/events/{offset}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - {
          name: offset,
          in: path,
          required: true,
          schema: { type: integer, minimum: 0, maximum: 10000 },
        }
    get:
      operationId: listMessageEvents
      responses:
        '200':
          description: Bounded signal-history page for an owned message
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /glyph/messages/{id}/send:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: sendMessage
      responses:
        '200':
          description: Message sent through Gmail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /glyph/activity:
    get:
      operationId: listActivity
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - {
            name: offset,
            in: query,
            schema: { type: integer, minimum: 0, maximum: 10000, default: 0 },
          }
        - {
            name: type,
            in: query,
            schema:
              {
                type: string,
                enum: [all, open, click, sent, reply, human, automated],
              },
          }
      responses:
        '200':
          description: Bounded, ordered page of the authenticated owner's signals
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /glyph/activity/read:
    post:
      operationId: markActivityRead
      responses:
        '200':
          description: Activity marked read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /glyph/settings:
    get:
      operationId: getSettings
      responses:
        '200':
          description: Authenticated owner's preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsInput' }
      responses:
        '200':
          description: Preferences saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /glyph/gmail/authorization:
    get:
      operationId: getGmailAuthorization
      responses:
        '200':
          description: Owner-scoped Gmail authorization status, without credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmailAuthorization' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: beginGmailAuthorization
      responses:
        '200':
          description: Single-use Google authorization URL bound to this owner and session
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Authorization must begin on the configured production origin
        '503':
          description: Google OAuth is not configured
    delete:
      operationId: disconnectGmail
      responses:
        '200':
          description: Owner credentials removed locally; Google revocation outcome reported separately
          content:
            application/json:
              schema:
                type: object
                required: [disconnected, revocationConfirmed]
                properties:
                  disconnected: { type: boolean }
                  revocationConfirmed: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: No personal Gmail connection exists; a legacy project connection is not disconnected here
  /glyph/gmail/oauth/callback:
    get:
      operationId: completeGmailAuthorization
      parameters:
        - in: query
          name: state
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
        - in: query
          name: code
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - in: query
          name: error
          schema: { type: string, maxLength: 256 }
      responses:
        '303':
          description: Redirect to the configured Gmail page with a fixed outcome code
        '401': { $ref: '#/components/responses/Unauthorized' }
  /glyph/connection:
    get:
      operationId: getConnection
      responses:
        '200':
          description: Authenticated user's Gmail connection; mailbox ownership is verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Bounded database and critical-schema readiness check
      description: Public operational status only. Returns 503 during draining or when PostgreSQL or critical tables cannot be reached within the probe budget. Does not test Gmail.
      responses:
        '200':
          description: Ready to serve database-backed requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
        '503':
          description: Database unavailable, critical schema missing, or server draining
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
  /glyph/attachments:
    post:
      operationId: requestAttachmentUpload
      summary: Create an owned private attachment upload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachmentInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201':
          description: Direct-to-storage upload URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentUpload' }
  /glyph/attachments/{id}/complete:
    post:
      operationId: completeAttachmentUpload
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Verified private attachment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
  /glyph/attachments/{id}:
    get:
      operationId: downloadAttachment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Owned attachment file, never served inline
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
    delete:
      operationId: deleteAttachment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '204': { description: Deleted an unreferenced owned attachment }
components:
  responses:
    Unauthorized:
      description: Sign-in is required to access account data
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
    Forbidden:
      description: The authenticated user is not allowed to access this resource
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
  schemas:
    ReadinessStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ready, not_ready] }
    NativeMessageInput:
      allOf:
        - { $ref: '#/components/schemas/MessageInput' }
        - type: object
          required: [senderEmail, composeKey, urls]
          properties:
            senderEmail: { type: string, format: email }
            toEmails:
              type: array
              maxItems: 100
              items: { type: string, format: email, maxLength: 254 }
            ccEmails:
              type: array
              maxItems: 100
              items: { type: string, format: email, maxLength: 254 }
            bccEmails:
              type: array
              maxItems: 100
              items: { type: string, format: email, maxLength: 254 }
            composeKey: { type: string, minLength: 16, maxLength: 100 }
            urls:
              type: array
              maxItems: 100
              items: { type: string, maxLength: 2000 }
    NativeTracking:
      type: object
      required: [messageId, pixelUrl, markerUrl, links]
      properties:
        messageId: { type: string }
        pixelUrl: { type: [string, 'null'] }
        markerUrl: { type: string }
        links:
          type: array
          items: { $ref: '#/components/schemas/NativeLink' }
    NativeLink:
      type: object
      required: [url, trackingUrl]
      properties:
        url: { type: string }
        trackingUrl: { type: string }
    NativeSync:
      type: object
      required:
        [
          confirmed,
          pending,
          repliesDetected,
          replyCheckPartial,
          replyCheckError,
        ]
      properties:
        confirmed: { type: integer }
        pending: { type: integer }
        repliesDetected: { type: integer }
        replyCheckPartial: { type: boolean }
        replyCheckError: { type: [string, 'null'] }
    ActionResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    SystemAccess:
      type: object
      required: [isSystemAdmin]
      properties:
        isSystemAdmin: { type: boolean }
    SystemSummary:
      type: object
      required:
        [
          usersTotal,
          loginSessionsTotal,
          loginSessionsLast24Hours,
          emailsSentTotal,
          emailsSentLast30Days,
          pixelLoadsTotal,
          linkClicksTotal,
          repliesTotal,
          adminAccessDeniedSessions,
          recentAdminAccessDenials,
        ]
      properties:
        usersTotal: { type: integer, minimum: 0 }
        loginSessionsTotal: { type: integer, minimum: 0 }
        loginSessionsLast24Hours: { type: integer, minimum: 0 }
        emailsSentTotal: { type: integer, minimum: 0 }
        emailsSentLast30Days: { type: integer, minimum: 0 }
        pixelLoadsTotal: { type: integer, minimum: 0 }
        linkClicksTotal: { type: integer, minimum: 0 }
        repliesTotal: { type: integer, minimum: 0 }
        adminAccessDeniedSessions: { type: integer, minimum: 0 }
        recentAdminAccessDenials:
          type: array
          items: { type: string, format: date-time }
    MessageInput:
      type: object
      required:
        [recipientEmail, recipientName, subject, body, trackOpens, trackClicks]
      properties:
        recipientEmail: { type: string, format: email, maxLength: 254 }
        toEmails:
          type: array
          maxItems: 100
          items: { type: string, format: email, maxLength: 254 }
        ccEmails:
          type: array
          maxItems: 100
          items: { type: string, format: email, maxLength: 254 }
        bccEmails:
          type: array
          maxItems: 100
          items: { type: string, format: email, maxLength: 254 }
        recipientName: { type: string, maxLength: 120 }
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 50000 }
        bodyHtml: { type: [string, 'null'], maxLength: 50000 }
        attachmentIds:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
        trackOpens: { type: boolean }
        trackClicks: { type: boolean }
    Message:
      type: object
      required:
        [
          id,
          recipientEmail,
          recipientName,
          subject,
          body,
          trackOpens,
          trackClicks,
          status,
          createdAt,
          sentAt,
          opens,
          clicks,
          replies,
          lastActivityAt,
        ]
      properties:
        id: { type: string }
        recipientEmail: { type: string }
        recipientName: { type: string }
        toEmails:
          type: array
          items: { type: string }
        ccEmails:
          type: array
          items: { type: string }
        bccEmails:
          type: array
          items: { type: string }
        subject: { type: string }
        body: { type: string }
        bodyHtml: { type: [string, 'null'] }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        trackOpens: { type: boolean }
        trackClicks: { type: boolean }
        status:
          { type: string, enum: [draft, sending, sent, failed, uncertain] }
        createdAt: { type: string }
        sentAt: { type: [string, 'null'] }
        opens: { type: integer }
        clicks: { type: integer }
        replies: { type: integer }
        lastActivityAt: { type: [string, 'null'] }
        deliverySource: { type: string, enum: [web, gmail] }
    AttachmentInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 180 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, minLength: 1, maxLength: 150 }
    Attachment:
      type: object
      required: [id, name, size, contentType]
      properties:
        id: { type: string }
        name: { type: string }
        size: { type: integer }
        contentType: { type: string }
    AttachmentUpload:
      type: object
      required: [attachment, uploadUrl]
      properties:
        attachment: { $ref: '#/components/schemas/Attachment' }
        uploadUrl: { type: string }
    MessageDetail:
      type: object
      required: [message, links]
      properties:
        message: { $ref: '#/components/schemas/Message' }
        links:
          type: array
          items: { $ref: '#/components/schemas/TrackedLink' }
    Pagination:
      type: object
      required: [limit, offset, total, hasMore]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0, maximum: 10000 }
        total: { type: integer, minimum: 0 }
        hasMore: { type: boolean }
    MessagePage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    ActivityPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    TrackedLink:
      type: object
      required: [id, url, clicks]
      properties:
        id: { type: string }
        url: { type: string }
        clicks: { type: integer }
    Activity:
      type: object
      required:
        [
          id,
          messageId,
          recipientName,
          recipientEmail,
          subject,
          type,
          occurredAt,
          url,
          automated,
          source,
          read,
        ]
      properties:
        id: { type: string }
        messageId: { type: string }
        recipientName: { type: string }
        recipientEmail: { type: string }
        subject: { type: string }
        type: { type: string, enum: [open, click, sent, reply] }
        occurredAt: { type: string }
        url: { type: [string, 'null'] }
        automated: { type: boolean }
        source: { type: string }
        read: { type: boolean }
    Overview:
      type: object
      required:
        [
          readOnly,
          totalSent,
          totalOpens,
          totalClicks,
          openRate,
          clickRate,
          unreadCount,
          daily,
        ]
      properties:
        readOnly: { type: boolean }
        totalSent: { type: integer }
        totalOpens: { type: integer }
        totalClicks: { type: integer }
        openRate: { type: number }
        clickRate: { type: number }
        unreadCount: { type: integer }
        daily:
          type: array
          items: { $ref: '#/components/schemas/DailyStat' }
    DailyStat:
      type: object
      required: [date, sent, opens, clicks]
      properties:
        date: { type: string }
        sent: { type: integer }
        opens: { type: integer }
        clicks: { type: integer }
    SettingsInput:
      type: object
      required:
        [
          notifyOpens,
          notifyClicks,
          defaultTrackOpens,
          defaultTrackClicks,
          trackingBaseUrl,
        ]
      properties:
        notifyOpens: { type: boolean }
        notifyClicks: { type: boolean }
        notifyReplies: { type: boolean, default: true }
        defaultTrackOpens: { type: boolean }
        defaultTrackClicks: { type: boolean }
        trackingBaseUrl: { type: string, maxLength: 500 }
    Settings:
      allOf:
        - { $ref: '#/components/schemas/SettingsInput' }
        - type: object
          required: [readOnly]
          properties:
            readOnly: { type: boolean }
    GmailAuthorization:
      type: object
      required: [configured, connectOrigin, connected, email, kind]
      properties:
        configured: { type: boolean }
        connectOrigin: { type: [string, 'null'] }
        connected: { type: boolean }
        email: { type: [string, 'null'] }
        kind: { type: string, enum: [personal, legacy, none] }
    Connection:
      type: object
      required: [connected, email, authorized, message]
      properties:
        connected: { type: boolean }
        authorized: { type: boolean }
        email: { type: [string, 'null'] }
        message: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
