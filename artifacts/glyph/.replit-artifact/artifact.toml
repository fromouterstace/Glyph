kind = "web"
previewPath = "/"
title = "Glyph"
description = "Gmail sales email tracking with glyph pixels, tracked links, engagement activity and sender alerts."
version = "1.0.0"
id = "artifacts/glyph"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26253

[services.development]
run = "pnpm --filter @workspace/glyph run dev"

[services.production]

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/glyph", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"
PORT = "26253"
BASE_PATH = "/"

[services.production.run]
args = [ "node", "artifacts/glyph/server/start.mjs" ]

[services.production.run.env]
NODE_ENV = "production"
PORT = "26253"
BASE_PATH = "/"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "26253"
BASE_PATH = "/"
